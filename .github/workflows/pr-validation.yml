name: PR validation
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -e '.[dev]'
      - run: ruff check .
      - run: pytest -q
      - run: python scripts/validate_repo.py
      - uses: azure/cli@v2
        with:
          inlineScript: az bicep build --file infra/main.bicep --stdout >/dev/null
