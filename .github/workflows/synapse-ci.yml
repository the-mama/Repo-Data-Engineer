name: Synapse CI and deployment
on:
  pull_request:
    paths: ['infra/**', 'synapse/**', 'pyproject.toml', 'sql/**', 'scripts/spark_smoke.py', 'scripts/deploy_synapse.py', 'scripts/deploy_synapse_pipelines.py', 'scripts/configure_synapse.py']
  push:
    branches: [main]
    paths: ['infra/**', 'synapse/**', 'pyproject.toml', 'sql/**', 'scripts/spark_smoke.py', 'scripts/deploy_synapse.py', 'scripts/deploy_synapse_pipelines.py', 'scripts/configure_synapse.py', '.github/workflows/synapse-ci.yml']
  workflow_dispatch:
    inputs:
      environment:
        type: choice
        options: [dev, prod]
        default: dev
permissions:
  contents: read
  id-token: write
concurrency:
  group: mobility-synapse-${{ inputs.environment || 'dev' }}
  cancel-in-progress: false
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -e '.[dev]'
      - run: ruff check . && pytest -q && python -m build --wheel
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: pip install -e '.[dev,spark]'
      - run: python scripts/spark_smoke.py
        env:
          SPARK_LOCAL_IP: 127.0.0.1
          PYSPARK_PYTHON: python
  deploy:
    if: github.event_name != 'pull_request'
    needs: [test, integration]
    environment: ${{ inputs.environment || 'dev' }}
    runs-on: ubuntu-latest
    env:
      RESOURCE_GROUP: ${{ vars.RESOURCE_GROUP }}
      SYNAPSE_WORKSPACE: ${{ vars.SYNAPSE_WORKSPACE }}
      SPARK_POOL: mobilityspark
      STORAGE_ACCOUNT: ${{ vars.STORAGE_ACCOUNT }}
      TARGET: ${{ inputs.environment || 'dev' }}
      SQL_ADMIN_OBJECT_ID: ${{ vars.SQL_ADMIN_OBJECT_ID }}
      SQL_ADMIN_LOGIN: ${{ vars.SQL_ADMIN_LOGIN }}
      ALERT_EMAIL: ${{ vars.ALERT_EMAIL }}
      REUSE_EXISTING_STORAGE: ${{ vars.REUSE_EXISTING_STORAGE || 'false' }}
      KEY_VAULT_URI: ${{ vars.KEY_VAULT_URI }}
      DATABASE_PREFIX: ${{ vars.DATABASE_PREFIX }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -e '.[dev]'
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - run: python scripts/preflight_infra.py --resource-group "$RESOURCE_GROUP" --storage "$STORAGE_ACCOUNT" --reuse-existing "$REUSE_EXISTING_STORAGE"
      - name: Deploy infrastructure before workspace artifacts
        run: >-
          az deployment group create -g "$RESOURCE_GROUP" --template-file infra/main.bicep
          --parameters "@infra/environments/$TARGET.parameters.json"
          --parameters storageAccountName="$STORAGE_ACCOUNT" reuseExistingStorage="$REUSE_EXISTING_STORAGE"
          sqlAdminObjectId="$SQL_ADMIN_OBJECT_ID" sqlAdminLogin="$SQL_ADMIN_LOGIN" alertEmail="$ALERT_EMAIL"
          --output none
      - run: SOURCE_DATE_EPOCH=946684800 python -m build --wheel
      - run: python scripts/deploy_synapse.py
      - run: python scripts/deploy_synapse_pipelines.py
