name: ADF publish and deploy
on:
  workflow_dispatch:
    inputs:
      environment:
        type: choice
        options: [dev, prod]
        default: dev
  push:
    branches: [main]
    paths: ['datafactory/**', 'scripts/*adf*', '.github/workflows/datafactory-deploy.yml']
permissions:
  contents: read
  id-token: write
concurrency:
  group: mobility-adf-${{ inputs.environment || 'dev' }}
  cancel-in-progress: false
jobs:
  publish-deploy:
    environment: ${{ inputs.environment || 'dev' }}
    runs-on: ubuntu-latest
    env:
      RESOURCE_GROUP: ${{ vars.RESOURCE_GROUP }}
      FACTORY_NAME: dftmprojects
      STORAGE_ACCOUNT: dltmprojects
      KEY_VAULT_URI: ${{ vars.KEY_VAULT_URI }}
      SQL_SERVER: ${{ vars.SQL_SERVER }}
      SYNAPSE_ENDPOINT: ${{ vars.SYNAPSE_ENDPOINT }}
      SYNAPSE_RESOURCE_ID: ${{ vars.SYNAPSE_RESOURCE_ID }}
      SPARK_POOL: mobilityspark
      DATABASE_PREFIX: ${{ vars.DATABASE_PREFIX }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - run: python scripts/configure_adf.py "$RUNNER_TEMP/adf"
      - run: npm ci --ignore-scripts
        working-directory: datafactory
      - name: Publish ARM from collaboration branch
        working-directory: datafactory
        env:
          SUBSCRIPTION: ${{ vars.AZURE_SUBSCRIPTION_ID }}
        run: npm run build export "$RUNNER_TEMP/adf" "/subscriptions/$SUBSCRIPTION/resourceGroups/$RESOURCE_GROUP/providers/Microsoft.DataFactory/factories/$FACTORY_NAME" arm-template/generated
      - uses: actions/upload-artifact@v4
        with:
          name: adf-arm-${{ github.sha }}
          path: ${{ github.workspace }}/datafactory/arm-template/generated
      - run: az extension add --name datafactory --upgrade
      - run: bash scripts/deploy_adf.sh
        env:
          ADF_TEMPLATE_DIR: ${{ github.workspace }}/datafactory/arm-template/generated
