[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"
[project]
name = "urban-mobility"
version = "0.3.0"
requires-python = ">=3.10"
dependencies = ["gtfs-realtime-bindings>=1.0,<3", "protobuf>=4.25,<7"]
[project.optional-dependencies]
dev = ["pytest>=8,<9", "ruff>=0.9,<1", "build>=1.2,<2", "PyYAML>=6,<7", "jsonschema>=4,<5"]
spark = ["pyspark==3.5.3", "delta-spark==3.2.1"]
[tool.setuptools.packages.find]
where = ["synapse/libs"]
[tool.pytest.ini_options]
pythonpath = ["synapse/libs"]
testpaths = ["synapse/tests"]
[tool.ruff]
line-length = 110
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
[tool.ruff.lint.per-file-ignores]
"synapse/notebooks/*.ipynb" = ["F821"] # spark is provided by the Synapse notebook runtime.
